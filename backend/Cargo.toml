[workspace]
members = [
  "crates/api",
  "crates/cli",
  "crates/config",
  "crates/db",
  "crates/domain",
  "crates/execution",
  "crates/ingest",
  "crates/platform-kalshi",
  "crates/platform-oddpool",
  "crates/platform-polymarket",
  "crates/queue",
  "crates/reconcile",
  "crates/risk",
  "crates/signal",
  "crates/worker",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "UNLICENSED"
publish = false
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = "0.7"
base64 = "0.22"
config = "0.14"
dotenvy = "0.15"
futures-util = "0.3"
hex = "0.4"
rand = "0.8"
redis = { version = "0.27", features = ["aio", "tokio-comp", "connection-manager"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
rsa = { version = "0.9", features = ["sha2"] }
rust_decimal = { version = "1.36", features = ["serde-with-str"] }
rust_decimal_macros = "1.36"
secrecy = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hmac = { version = "0.12", features = ["std"] }
sha3 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "time", "json", "rust_decimal", "migrate"] }
thiserror = "1.0"
time = { version = "=0.3.44", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "signal", "time", "net", "sync"] }
tracing = "0.1"
tower-http = { version = "0.5", features = ["cors"] }
jsonwebtoken = "9"
k256 = { version = "0.13", features = ["ecdsa"] }
ring = "0.17"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "=1.10.0", features = ["serde", "v4", "v5"] }
