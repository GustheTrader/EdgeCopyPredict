[package]
name = "arbitek-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "arbitek-worker"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
arbitek-config = { path = "../config" }
arbitek-db = { path = "../db" }
arbitek-domain = { path = "../domain" }
arbitek-execution = { path = "../execution" }
arbitek-platform-kalshi = { path = "../platform-kalshi" }
arbitek-platform-polymarket = { path = "../platform-polymarket" }
arbitek-queue = { path = "../queue" }
secrecy.workspace = true
time.workspace = true
tokio.workspace = true
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres"] }
